<style>

/* App shell: one phone frame, navy ground, the design scaled to fit. */
:root { --ground: #04112A; --navy: #071A3D; --sun: #FFC93C; --ink: #071A3D; --paper: #F7FAFF; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
#cf-shell { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cf-stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; transform-origin: center; overflow: hidden; border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 10px #0E2A5C; background: var(--navy); }
.cf-phone #cf-stage { border-radius: 0; box-shadow: none; }
.cf-screen { position: absolute; inset: 0; }
.cf-screen > div:first-child { height: 100% !important; }
.cf-in { animation: cfScrIn .34s cubic-bezier(.2,.8,.2,1) both; }
.cf-in-back { animation: cfScrInB .34s cubic-bezier(.2,.8,.2,1) both; }
.cf-out { animation: cfScrOut .3s ease both; pointer-events: none; }
.cf-out-back { animation: cfScrOutB .3s ease both; pointer-events: none; }
@keyframes cfScrIn { from { transform: translateX(40px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes cfScrInB { from { transform: translateX(-40px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes cfScrOut { to { transform: translateX(-30px); opacity: 0 } }
@keyframes cfScrOutB { to { transform: translateX(30px); opacity: 0 } }
#cf-toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--sun); color: var(--ink); font: 800 14px 'Plus Jakarta Sans', system-ui, sans-serif; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 4px 0 #C9930C; }
#cf-toast.show { animation: cfToast 1.8s ease both; }
@keyframes cfToast { 0% { opacity: 0; transform: translate(-50%, 12px) } 12%, 82% { opacity: 1; transform: translate(-50%, 0) } 100% { opacity: 0 } }
a, button { -webkit-touch-callout: none; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .cf-in, .cf-in-back, .cf-out, .cf-out-back { animation: none; } }

/* App-Bienvenue */
@keyframes bwIn{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bwUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes bwFloat{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes bwSpin{to{transform:rotate(360deg)}}
@keyframes bwDrive{0%,100%{translate:-10px 0}50%{translate:10px 0}}
@keyframes bwRing{from{transform:scale(.8);opacity:.7}to{transform:scale(1.4);opacity:0}}
.bw-in{animation:bwIn .65s cubic-bezier(.2,.8,.2,1) both}
.bw-up{animation:bwUp .6s .15s cubic-bezier(.2,.8,.2,1) both}
.bw-up2{animation:bwUp .6s .28s cubic-bezier(.2,.8,.2,1) both}
.bw-float{animation:bwFloat 3.6s ease-in-out infinite}
.bw-drive{animation:bwDrive 2.2s ease-in-out infinite}
.bw-wheel{animation:bwSpin .9s linear infinite;transform-box:fill-box;transform-origin:center}
.bw-ring{animation:bwRing 2.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* App-Connexion */
@keyframes cxIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes cxFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes cxPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes cxSpin{to{transform:rotate(360deg)}}
.cx-in{animation:cxIn .45s cubic-bezier(.2,.8,.2,1) both}
.cx-float{animation:cxFloat 3.4s ease-in-out infinite}
.cx-pop{animation:cxPop .55s cubic-bezier(.2,.8,.2,1) both}
.cx-spin{animation:cxSpin .8s linear infinite}
.cx-field{font:inherit;font-size:15px;width:100%;box-sizing:border-box;padding:12px 14px;min-height:48px;border:2px solid #C9D8EC;border-radius:14px;background:#ffffff;color:#071A3D;outline:none;transition:border-color .2s ease}
.cx-field:focus{border-color:#0D5BD8}
.cx-field::placeholder{color:#8A9AB5}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* App-Accueil */
@keyframes acIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes acGrow{from{width:0}}
@keyframes acWob{0%,100%{rotate:-8deg}50%{rotate:4deg}}
@keyframes acDrive{0%,100%{translate:-5px 0}50%{translate:5px 0}}
@keyframes acPulse{0%{box-shadow:0 0 0 0 rgba(13,91,216,.55)}100%{box-shadow:0 0 0 9px rgba(13,91,216,0)}}
@keyframes acUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ac-in{animation:acIn .55s cubic-bezier(.2,.8,.2,1) both}
.ac-grow{animation:acGrow 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
.ac-wobble{animation:acWob 2.6s ease-in-out infinite}
.ac-drive{animation:acDrive 1.8s ease-in-out infinite}
.ac-pulse{animation:acPulse 1.5s ease-out infinite}
.ac-up{animation:acUp .6s cubic-bezier(.2,.8,.2,1) both}
.ac-up2{animation:acUp .6s .12s cubic-bezier(.2,.8,.2,1) both}
.ac-up3{animation:acUp .6s .24s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* App-Collecte */
@keyframes ccDrive{0%,100%{translate:-4px 0}50%{translate:4px 0}}
@keyframes ccUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ccShake{0%,100%{rotate:0deg}25%{rotate:-6deg}75%{rotate:6deg}}
.cc-drive{animation:ccDrive 1.6s ease-in-out infinite}
.cc-up{animation:ccUp .5s cubic-bezier(.2,.8,.2,1) both}
.cc-shake{animation:ccShake .6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* App-Suivi */
@keyframes stDash{to{stroke-dashoffset:-30}}
@keyframes stPing{0%{transform:scale(.4);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes stIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes stPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes stBob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes stBlink{50%{opacity:.3}}
@keyframes stShine{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes stSpin{to{transform:rotate(360deg)}}
@keyframes stTrA{from{transform:translateX(-30px)}to{transform:translateX(790px)}}
@keyframes stTrB{from{transform:translateX(790px)}to{transform:translateX(-30px)}}
@keyframes stTrC{from{transform:translateY(-30px)}to{transform:translateY(1180px)}}
@keyframes stTrD{from{transform:translateY(1180px)}to{transform:translateY(-30px)}}
@keyframes stSheet{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.st-dash{stroke-dasharray:3 9;animation:stDash 1.2s linear infinite}
.st-ping{animation:stPing 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.st-ping2{animation:stPing 2.2s 1.1s ease-out infinite;transform-box:fill-box;transform-origin:center}
.st-in{animation:stIn .55s cubic-bezier(.2,.8,.2,1) both}
.st-pop{animation:stPop .5s cubic-bezier(.2,.8,.2,1) both}
.st-bob{animation:stBob 1.6s ease-in-out infinite}
.st-blink{animation:stBlink 1s step-end infinite}
.st-spin{animation:stSpin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.st-shine{background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);background-size:200px 100%;background-repeat:no-repeat;animation:stShine 2.4s linear infinite}
.st-sheet-in{animation:stSheet .35s cubic-bezier(.2,.8,.2,1) both}
.st-tr1{animation:stTrA 9s linear infinite}
.st-tr2{animation:stTrB 11s linear infinite}
.st-tr3{animation:stTrC 13s 2s linear infinite}
.st-tr4{animation:stTrD 10s linear infinite}
.st-tr5{animation:stTrB 8s 1s linear infinite}
.st-map{touch-action:none;cursor:grab}
.st-map:active{cursor:grabbing}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
/* App-Membre */

/* App-Profil */
@keyframes prIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pr-in{animation:prIn .45s cubic-bezier(.2,.8,.2,1) both}
.pr-row{transition:background .15s ease}
.pr-row:active{background:#EEF4FC}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  }

  /* ---------- component base ---------- */
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (u) {
    var patch = typeof u === 'function' ? u(this.state, this.props) : u;
    if (patch) this.state = Object.assign({}, this.state, patch);
    this.__sched && this.__sched();
  };
  DCLogic.prototype.forceUpdate = function () { this.__sched && this.__sched(); };
  DCLogic.prototype.renderVals = function () { return {}; };

  /* ES classes need real class syntax for `extends`; wrap the prototype base. */
  var Base = (function () {
    try { return new Function('D', 'return class DCLogic { constructor(p){ D.call(this,p); } setState(u){ return D.prototype.setState.call(this,u); } forceUpdate(){ return D.prototype.forceUpdate.call(this); } renderVals(){ return {}; } }')(DCLogic); }
    catch (e) { return DCLogic; }
  })();

  /* ---------- app shell ---------- */
  var screens = window.CF_SCREENS || {};
  var compiled = {};
  var current = null;
  var stage = document.getElementById('cf-stage');
  var toastEl = document.getElementById('cf-toast');
  var toastTimer;
  var nav = {
    toast: function (msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.hidden = false;
      toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
    }
  };

  function getScreen(name) {
    if (compiled[name]) return compiled[name];
    var s = screens[name];
    if (!s) return null;
    var tpl = document.createElement('template');
    tpl.innerHTML = s.html;
    var Cls = new Function('DCLogic', s.js + '\n;return Component;')(Base);
    compiled[name] = { tree: compile(tpl.content), Cls: Cls };
    return compiled[name];
  }

  /* ---------- website mode: one page rendered into #cf-page ---------- */
  if (window.CF_PAGE) {
    var pageBox = document.getElementById('cf-page');
    var ps = getScreen(window.CF_PAGE);
    var plogic = new ps.Cls({});
    var ppending = false;
    var ppaint = function () {
      ppending = false;
      try { patchChildren(pageBox, render(ps.tree, plogic.renderVals(), nav)); } catch (e) { console.error(e); }
    };
    plogic.__sched = function () { if (!ppending) { ppending = true; Promise.resolve().then(ppaint); } };
    // replace the pre-rendered copy (kept for search engines) with the live page
    var keepScroll = window.scrollY;
    pageBox.textContent = '';
    ppaint();
    window.scrollTo(0, keepScroll);
    if (location.hash && location.hash.length > 1) {
      var target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView();
    }
    try { plogic.componentDidMount && plogic.componentDidMount(); } catch (e) { console.error(e); }
    return;
  }

  function mount(name, dir) {
    var s = getScreen(name);
    if (!s) { name = window.CF_START; s = getScreen(name); }
    if (current) {
      try { current.logic.componentWillUnmount && current.logic.componentWillUnmount(); } catch (e) { console.error(e); }
      var oldBox = current.box;
      oldBox.classList.add(dir < 0 ? 'cf-out-back' : 'cf-out');
      setTimeout(function () { if (oldBox.parentNode) oldBox.parentNode.removeChild(oldBox); }, 320);
    }
    var box = document.createElement('div');
    box.className = 'cf-screen ' + (current ? (dir < 0 ? 'cf-in-back' : 'cf-in') : '');
    stage.appendChild(box);
    var logic = new s.Cls({});
    var pending = false;
    var paint = function () {
      pending = false;
      try { patchChildren(box, render(s.tree, logic.renderVals(), nav)); }
      catch (e) { console.error(e); }
    };
    logic.__sched = function () { if (!pending) { pending = true; Promise.resolve().then(paint); } };
    paint();
    current = { name: name, box: box, logic: logic };
    try { logic.componentDidMount && logic.componentDidMount(); } catch (e) { console.error(e); }
  }

  var order = window.CF_ORDER || [];
  function route() {
    var m = /^#\/([A-Za-z0-9_-]+)$/.exec(location.hash);
    var name = m ? m[1] : window.CF_START;
    if (current && current.name === name) return;
    var dir = current ? (order.indexOf(name) < order.indexOf(current.name) ? -1 : 1) : 1;
    mount(name, dir);
  }
  window.addEventListener('hashchange', route);

  /* ---------- fit the 390px-wide design to any screen ---------- */
  var shell = document.getElementById('cf-shell');
  function fit() {
    var r = shell.getBoundingClientRect();
    var W = r.width, H = r.height;
    var phone = W < 600;
    var s, h;
    if (phone) {
      s = W / 390;
      h = H / s;
      if (h < 700) { s = H / 700; h = 700; }
    } else {
      s = Math.min(1, (H - 32) / 844);
      h = 844;
    }
    stage.style.height = h + 'px';
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    document.documentElement.classList.toggle('cf-phone', phone);
  }
  window.addEventListener('resize', fit);
  fit();
  route();
})();

</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/app/sw.js').catch(function () {}); }); }</script>
